name: Live tests

# Calls real model providers and costs money, so it only runs when started by hand.
# Fork PRs never get secrets, which is why these tests are not part of PR CI.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Anthropic model for the evals
        default: claude-sonnet-5-5
      mode:
        description: Review mode for the evals (compare runs both and costs more)
        type: choice
        options: [single-pass, agentic, compare]
        default: single-pass
      verify:
        description: Also run with the verify pass and compare (P5-2; about doubles the eval cost)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Evals (Anthropic)
        run: pnpm eval --provider anthropic --model "$EVAL_MODEL" --mode "$EVAL_MODE" --json eval-report.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_MODE: ${{ inputs.mode }}
      - name: Evals with the verify pass, compared with the run above
        if: inputs.verify
        run: pnpm eval --provider anthropic --model "$EVAL_MODEL" --mode "$EVAL_MODE" --verify --json eval-report-verify.json --baseline eval-report.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: eval-report*.json
          if-no-files-found: ignore
