name: Lock not released + swallowed error
description: Two issues in one file. The early return in withdraw keeps the mutex locked forever, so every later call hangs. loadBalance swallows read errors, leaving a stale balance with no trace.
before:
  src/mutex.ts: |
    export class Mutex {
      private queue: (() => void)[] = [];
      private locked = false;

      async acquire(): Promise<void> {
        if (!this.locked) {
          this.locked = true;
          return;
        }
        await new Promise<void>((resolve) => this.queue.push(resolve));
      }

      release(): void {
        const next = this.queue.shift();
        if (next) next();
        else this.locked = false;
      }
    }
after:
  src/account.ts: |
    import { Mutex } from './mutex';

    const mutex = new Mutex();
    let balance = 0;

    export async function withdraw(amount: number): Promise<boolean> {
      await mutex.acquire();
      if (amount > balance) return false;
      balance -= amount;
      mutex.release();
      return true;
    }

    export async function loadBalance(read: () => Promise<number>): Promise<void> {
      try {
        balance = await read();
      } catch (e) {}
    }
expected:
  - file: src/account.ts
    lines: 8
    category: bug
    severity: critical
    title: The early return never releases the mutex, so later calls hang
    quote: 'if (amount > balance) return false;'
  - file: src/account.ts
    lines: 17
    category: [bug, maintainability]
    severity: major
    title: Read errors are swallowed silently
    quote: '} catch (e) {}'
